# Temporary: validates the oras alias-tag steps from push-artifacts.yaml (kai-scheduler/KAI-Scheduler#2393).
name: Test ORAS alias tag
on:
  push:
    branches:
      - test/oras-alias-tag

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: "ghcr.io/gshaibi/kai-semver-test"

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        version: [v0.0.1, v0.0.2, 0.0.0-abc1234]
    steps:
      - name: Set package version
        run: echo "PACKAGE_VERSION=${{ matrix.version }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build helm chart
        run: |
          helm create kai-scheduler
          helm package ./kai-scheduler -d ./charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION

      # --- copied verbatim from push-artifacts.yaml ---
      - name: Push Helm Chart
        run: |
          helm push ./charts/kai-scheduler-$PACKAGE_VERSION.tgz oci://${{ env.DOCKER_REGISTRY }}

      - name: Set up ORAS
        if: startsWith(env.PACKAGE_VERSION, 'v')
        uses: oras-project/setup-oras@v2

      # Helm ignores v-prefixed OCI tags when resolving version ranges (e.g. ~0.18.0), so add a plain semver alias.
      - name: Tag Helm Chart without v prefix
        if: startsWith(env.PACKAGE_VERSION, 'v')
        run: |
          oras tag ${{ env.DOCKER_REGISTRY }}/kai-scheduler:$PACKAGE_VERSION ${PACKAGE_VERSION#v}
      # --- end copy ---

  verify:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        run: |
          set -euo pipefail
          R=oci://${{ env.DOCKER_REGISTRY }}/kai-scheduler
          check() { got=$(helm show chart $R --version "$1" | awk '/^version:/{print $2}'); echo "--version '$1' -> $got (want $2)"; [ "$got" = "$2" ]; }
          check "~0.0.1" v0.0.2
          check "0.0.x" v0.0.2
          check "v0.0.1" v0.0.1
          check "0.0.1" v0.0.1
          check "0.0.0-abc1234" 0.0.0-abc1234
          docker run --rm -v $HOME/.docker:/root/.docker:ro gcr.io/go-containerregistry/crane ls ${{ env.DOCKER_REGISTRY }}/kai-scheduler | sort > tags.txt
          cat tags.txt
          printf '%s\n' 0.0.0-abc1234 0.0.1 0.0.2 v0.0.1 v0.0.2 | sort | diff - tags.txt
